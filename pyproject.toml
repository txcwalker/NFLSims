[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nflsims"
version = "0.1.0"
description = "NFLSims -- Monte Carlo NFL simulation engine, DFS optimizer, and live analytics platform"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# Single source of truth stays requirements.txt -- see its header for the
# validated Python 3.12 pin rationale. Don't duplicate versions here.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
# Audit S0.3/S3-16/S3-32: bare `pytest` (no path arg) used to wander into
# scratch/ and legacy/ and error out on a dead 127.0.0.1:8000 request at
# import. Scope discovery to the real suite.
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
