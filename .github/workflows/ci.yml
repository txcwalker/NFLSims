name: CI

# Audit S3-24/S3-31: the only existing workflows are the 4th-down bot's --
# nothing ran the pytest suite on push/PR before this. Keeps it separate from
# nfl_live.yml / nfl_manuel.yml (the R live-bot workflows), which are
# unaffected by this addition.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run test suite
        run: pytest tests/ -q

  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, frontend_analysis]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build
        working-directory: ${{ matrix.app }}
        run: npm run build
